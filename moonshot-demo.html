<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moonshot 官网效果复刻 Demo</title>
<style>
  /* =========================================================
     配色 / 字体（对应真实站点：深色底 + M PLUS 1 / MiSans）
     ========================================================= */
  :root{
    --bg:#000;
    --fg:#fff;
    --muted:rgba(255,255,255,.6);
    --cta-border:rgba(255,255,255,.42);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg);
    font-family:"M PLUS 1",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;
    -webkit-font-smoothing:antialiased;}

  /* =========================================================
     HERO
     结构对应真实 DOM：
       .hero > .bgWrapper > .bgSceneContainer(.sceneVisible) > .sceneFrame
            > .gradientOverlay
            .content > .tagline / .inputWrap(.chatInput) / .buttons(.cta)
     ========================================================= */
  .hero{position:relative;display:flex;flex-direction:column;align-items:center;
    justify-content:center;width:100%;min-height:876px;padding:80px 0;overflow:hidden;}

  /* 背景容器：真实站点里这里挂载 Unicorn Studio 的 WebGL/canvas 场景。
     我们用 CSS 模糊光团(径向渐变+blur)廉价复刻那种"能量→智能"的流动星云感。 */
  .bgWrapper{position:absolute;inset:0;z-index:0;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;}
  .orb{position:absolute;width:60vmax;height:60vmax;border-radius:50%;
    filter:blur(80px);opacity:.55;mix-blend-mode:screen;
    background:radial-gradient(circle at 30% 30%,#7c5cff,transparent 60%);
    animation:float1 18s ease-in-out infinite alternate;}
  .orb.b{background:radial-gradient(circle at 70% 40%,#23d5ff,transparent 60%);
    animation:float2 22s ease-in-out infinite alternate;}
  .orb.c{background:radial-gradient(circle at 50% 60%,#ff5ca8,transparent 60%);
    animation:float3 26s ease-in-out infinite alternate;}
  @keyframes float1{from{transform:translate(-10%,-8%) scale(1)}to{transform:translate(15%,10%) scale(1.2)}}
  @keyframes float2{from{transform:translate(10%,5%) scale(1.1)}to{transform:translate(-12%,-10%) scale(.9)}}
  @keyframes float3{from{transform:translate(0,12%) scale(.95)}to{transform:translate(8%,-14%) scale(1.15)}}

  /* 底部黑色渐变叠层，保证文字可读（真实站点用 linear-gradient(to top,#000,#transparent)） */
  .gradientOverlay{position:absolute;left:0;right:0;bottom:0;width:100%;height:331px;
    background:linear-gradient(to top,#000 37%,transparent);z-index:1;pointer-events:none;}

  /* 内容层 */
  .content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
    gap:52px;width:calc(100% - 40px);max-width:740px;margin:0 auto;padding-top:344px;}
  .tagline{font-size:24px;font-weight:300;letter-spacing:.72px;color:#fff;opacity:.6;text-align:center;}

  /* ---------- 玻璃拟态聊天输入框 ----------
     对应 .chatInput：半透明底 + backdrop-filter 模糊 + inset 内描边
     .borderOverlay 用 inset box-shadow 模拟 1px 内高光/暗边，pointer-events:none 不挡输入 */
  .inputWrap{width:100%;}
  .chatInput{position:relative;display:flex;flex-direction:column;gap:12px;
    padding:18px 12px 12px;border-radius:24px;width:100%;overflow:hidden;
    background:rgba(51,51,51,.3);
    backdrop-filter:blur(23px) brightness(.6);-webkit-backdrop-filter:blur(23px) brightness(.6);
    border:1px solid transparent;transition:background .2s,border-color .2s,box-shadow .2s;}
  .chatInput:hover{background:rgba(51,51,51,.35);}
  .chatInput:focus-within{background:rgba(51,51,51,.35);border-color:rgba(255,255,255,.12);
    box-shadow:0 0 40px rgba(255,255,255,.25);}
  .textareaWrap{flex:1;}
  textarea{width:100%;min-height:56px;resize:none;background:transparent;border:0;outline:0;
    color:#fff;font-size:16px;line-height:24px;font-family:inherit;}
  textarea::placeholder{color:rgba(255,255,255,.5);}
  .sendRow{display:flex;justify-content:flex-end;}
  .sendBtn{width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#7c5cff,#23d5ff);transition:transform .2s,filter .2s;}
  .sendBtn:hover{transform:scale(1.08);filter:brightness(1.15);}
  .sendBtn svg{width:18px;height:18px;fill:#fff;}
  /* inset 内描边叠层（对应 .borderOverlay） */
  .borderOverlay{position:absolute;inset:0;border-radius:24px;pointer-events:none;z-index:3;
    box-shadow:inset 1px 1px .5px -1px rgba(255,255,255,.15),
               inset -1px -1px .5px -1px rgba(255,255,255,.15),
               inset 0 0 3px rgba(255,255,255,.08),
               inset 0 0 11px rgba(255,255,255,.04);}

  /* ---------- CTA 胶囊按钮 + 箭头悬停展开 ----------
     对应 .cta / .arrow：箭头默认 width:0/opacity:0，hover 时 width→24px、opacity→1 */
  .buttons{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .cta{display:flex;align-items:center;justify-content:center;padding:12px 20px;
    border-radius:999px;border:1px solid var(--cta-border);background:transparent;
    color:rgba(255,255,255,.56);font-size:16px;font-weight:450;text-decoration:none;
    cursor:pointer;white-space:nowrap;overflow:hidden;
    transition:border-color .2s,background .2s,color .2s,padding .2s;}
  .cta .arrow{display:inline-flex;align-items:center;justify-content:center;
    width:0;margin-left:0;opacity:0;overflow:hidden;flex-shrink:0;
    transition:width .2s ease,opacity .2s ease,margin-left .2s ease;}
  .cta .arrow svg{width:24px;height:24px;}
  .cta:hover{border-color:#fff;background:rgba(255,255,255,.05);color:#fff;padding:12px 12px 12px 20px;}
  .cta:hover .arrow{width:24px;margin-left:6px;opacity:1;}

  /* =========================================================
     滚动揭示（对应 ._reveal / ._revealRotate）
     用 IntersectionObserver 给进入视口的元素加 .in → 触发过渡
     ========================================================= */
  .reveal{opacity:0;transform:translateY(30px);
    transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1);}
  .reveal.rotate{transform:translateY(24px) rotate(1.5deg);transform-origin:0 100%;
    transition:opacity 1.05s cubic-bezier(.16,1,.3,1),transform 1.05s cubic-bezier(.16,1,.3,1);}
  .reveal.in{opacity:1;transform:none;}

  /* 后续区块（仅用于演示滚动揭示） */
  section.block{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:120px 24px;}
  .block h2{font-size:36px;font-weight:400;margin-bottom:16px;}
  .block p{color:var(--muted);font-size:18px;line-height:1.7;max-width:640px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:40px;}
  .card{height:200px;border-radius:20px;background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden;}
  .card::after{content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%,rgba(124,92,255,.4),transparent 60%);}
</style>
</head>
<body>

  <!-- ============ HERO ============ -->
  <section class="hero">
    <div class="bgWrapper">
      <!-- 真实站点此处由 Unicorn Studio 注入 WebGL canvas；
           这里用 CSS 模糊光团复刻流动背景 -->
      <div class="orb"></div>
      <div class="orb b"></div>
      <div class="orb c"></div>
    </div>
    <div class="gradientOverlay"></div>

    <div class="content">
      <p class="tagline">寻求将能源转化为智能的最优解</p>

      <div class="inputWrap">
        <div class="chatInput">
          <div class="textareaWrap">
            <textarea placeholder="有什么可以帮你的？"></textarea>
          </div>
          <div class="sendRow">
            <button class="sendBtn" aria-label="发送">
              <svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-7-8-3z"/></svg>
            </button>
          </div>
          <div class="borderOverlay"></div>
        </div>
      </div>

      <div class="buttons">
        <a class="cta" href="#">进入 Kimi
          <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </a>
        <a class="cta" href="#">最新研究
          <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </a>
      </div>
    </div>
  </section>

  <!-- ============ 演示滚动揭示 ============ -->
  <section class="block">
    <h2 class="reveal">轻松解决复杂难题</h2>
    <p class="reveal">以新一代大模型能力为基座，赋能深度研究、一键建站、智能制表及 PPT 自主编辑，让复杂工作化繁为简。</p>
    <div class="cards">
      <div class="card reveal rotate"></div>
      <div class="card reveal rotate"></div>
      <div class="card reveal rotate"></div>
    </div>
  </section>

  <section class="block">
    <h2 class="reveal">一念之间，万象 Kimi</h2>
    <p class="reveal">节日、纪念日、话题……每一个 Doodle 都是愉悦的惊喜，一键打开 Kimi 多重宇宙。</p>
  </section>

<script>
  /* =========================================================
     滚动揭示：真实站点用 IntersectionObserver 给 ._reveal 元素
     进入视口时切换为可见态（本 Demo 用 .in 类触发 CSS 过渡）
     ========================================================= */
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, {threshold:0.15});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

  /* =========================================================
     真实站点的 HERO 背景由 Unicorn Studio 接管：
       1) <script src="unicornStudio-2.1.4.umd.js">
       2) 在场景容器上挂载 data-us-project="<项目ID>"
       3) UnicornStudio.init() 把 WebGL/canvas 场景注入该容器
     下面这段是等价写法示意（本项目用 CSS 光团替代，无需引入）：
     ----------------------------------------------------------
     <script src="https://cdn.jsdelivr.net/npm/@unicorn-studio/unicorn-studio@2.1.4/dist/unicornStudio.umd.js"></script>
     <script> window.UnicornStudio && UnicornStudio.init(); </script>
     ========================================================= */
</script>
</body>
</html>
