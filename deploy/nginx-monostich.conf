# /etc/nginx/sites-available/monostich
# 两个 server：博客主站（纯静态）+ PocketBase 后台反代。
# TLS 建议用 certbot --nginx 自动补 443 配置。

# ---- 博客主站 ----
server {
    listen 80;
    listen [::]:80;
    server_name monostich.cloud www.monostich.cloud;

    root /var/www/monostich.cloud/current;   # 现有 CI/CD 的发布软链（releases/current）
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ---- PocketBase 管理后台 + API（仅本机回环，nginx 反代暴露）----
server {
    listen 80;
    listen [::]:80;
    server_name admin.monostich.cloud;

    client_max_body_size 50m;     # 允许上传大图

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PocketBase realtime 走 SSE
        proxy_buffering off;
        proxy_read_timeout 360s;
    }
}
