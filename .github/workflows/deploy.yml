name: Deploy monostich.cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - content-published

permissions:
  contents: read

concurrency:
  group: monostich-cloud-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          # 构建时从线上 PocketBase 拉取 published 内容并物化附件
          PB_BASE_URL: https://admin.monostich.cloud

      - name: Package build output
        run: tar -C dist -czf site.tar.gz .

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload release archive
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -P "$DEPLOY_PORT" site.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/monostich-cloud-${GITHUB_SHA}.tar.gz"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE_ID='${GITHUB_SHA}' bash -s" <<'REMOTE_SCRIPT'
          set -eu

          site_root=/var/www/monostich.cloud
          release_dir="$site_root/releases/$RELEASE_ID"
          archive="/tmp/monostich-cloud-$RELEASE_ID.tar.gz"

          mkdir -p "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          ln -sfn "$release_dir" "$site_root/current"
          rm -f "$archive"

          cd "$site_root/releases"
          ls -1dt */ | tail -n +6 | xargs -r rm -rf
          REMOTE_SCRIPT
